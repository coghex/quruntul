name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for fixture repositories
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch master
      - name: Engine
        run: python -m unittest discover -s tests -t . -v
      - name: Legacy coordinators
        run: |
          (cd skills/test/scripts && python -m unittest test_test_coordinator)
          (cd skills/profile/scripts && python -m unittest test_profile_coordinator)
  # The one check the PR drainer requires of CI: every matrix leg of `test`
  # passed, and the review gate's stale-approval step still behaves.
  build-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every test leg
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          [ "$RESULT" = success ] || { echo "test matrix: $RESULT"; exit 1; }
      - uses: actions/checkout@v4
      - name: Check the docs-landing helper
        run: |
          bash -n tools/docs_land.sh
          python3 -m py_compile tools/docs_land_paths.py
      - name: Test the review gate's stale-approval step
        run: python3 tools/test_review_gate.py
